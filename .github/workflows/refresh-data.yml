name: Refresh catalog snapshot
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "signal-lab-bot"
          git config user.email "signal-lab@qdt.ai"
          git add data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Refresh catalog snapshot"
            git push
          fi
